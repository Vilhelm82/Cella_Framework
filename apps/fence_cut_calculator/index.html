<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two-Tape Fence Cuts</title>
<meta name="description" content="Step-by-step cut calculator for sheet metal fencing on sloping ground: measure each post and bay, then mark the top and bottom cuts on a whole bay's sheets with two string lines.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  --ground: #E8ECE8;
  --surface: #F7F9F6;
  --well: #DCE2DC;
  --ink: #16201B;
  --ink-2: #4E5B54;
  --rule: #C6CEC7;
  --tape: #F4C20D;
  --tape-ink: #1B1A10;
  --tape-edge: #C29600;
  --chalk: #1D5FD1;
  --chalk-soft: rgba(29, 95, 209, 0.08);
  --steel: #A7B2AC;
  --rail: #33403A;
  --warn: #8F5B00;
  --need: #D2331C;
  --need-soft: rgba(210, 51, 28, 0.08);
  --need-glow: rgba(210, 51, 28, 0.35);
  --good: #2A7A4B;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #111513;
    --surface: #19201C;
    --well: #232B27;
    --ink: #E3E9E5;
    --ink-2: #9DAAA2;
    --rule: #34403A;
    --tape-edge: #B38A00;
    --chalk: #72A5FF;
    --chalk-soft: rgba(114, 165, 255, 0.10);
    --steel: #4F5B55;
    --rail: #C9D2CC;
    --warn: #E2B04E;
    --need: #FF6A55;
    --need-soft: rgba(255, 106, 85, 0.10);
    --need-glow: rgba(255, 106, 85, 0.40);
    --good: #6CC990;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #111513;
  --surface: #19201C;
  --well: #232B27;
  --ink: #E3E9E5;
  --ink-2: #9DAAA2;
  --rule: #34403A;
  --tape-edge: #B38A00;
  --chalk: #72A5FF;
  --chalk-soft: rgba(114, 165, 255, 0.10);
  --steel: #4F5B55;
  --rail: #C9D2CC;
  --warn: #E2B04E;
  --need: #FF6A55;
  --need-soft: rgba(255, 106, 85, 0.10);
  --need-glow: rgba(255, 106, 85, 0.40);
  --good: #6CC990;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 16px/1.5 var(--body);
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
.app {
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 12px 48px;
  display: grid;
  gap: 14px;
}
.bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand {
  appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
  font: 700 1.1rem/1 var(--display);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink);
}
.crumb { font-size: 0.88rem; color: var(--ink-2); text-align: right; }
.card {
  display: grid;
  gap: 14px;
  padding: 18px;
  border: 1px solid var(--rule);
  border-radius: 12px;
  background: var(--surface);
}
.card > * { margin: 0; min-width: 0; }
.eyebrow {
  font: 600 0.76rem/1 var(--body);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-2);
}
h1 { font: 700 2.2rem/1 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
h2 { font: 700 1.5rem/1 var(--display); letter-spacing: 0.02em; }
.instr { font-size: 1.08rem; }
.instr b { font-weight: 700; }
.pic svg { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; }
.hs-sheet { fill: var(--steel); opacity: 0.35; }
.hs-post { fill: var(--rail); }
.hs-rail { stroke: var(--rail); stroke-width: 5; stroke-linecap: square; }
.hs-pl { fill: var(--ink); font: 700 14px var(--display); letter-spacing: 0.04em; }
.hs-a line { stroke-width: 2; }
.hs-a.hot line { stroke: var(--need); stroke-width: 3.2; }
.hs-a.hot polygon { fill: var(--need); }
.hs-a.hot text { fill: var(--need); font: 700 13px var(--body); }
.hs-a.hot { animation: blink 1.3s ease-in-out infinite; }
.hs-a.done line { stroke: var(--chalk); }
.hs-a.done polygon { fill: var(--chalk); }
.hs-a.done text { fill: var(--chalk); font: 600 12px var(--mono); }
.hs-a.off line { stroke: var(--rule); stroke-dasharray: 3 3; }
.hs-a.off polygon { fill: var(--rule); }
@keyframes blink { 50% { opacity: 0.35; } }

/* the big measuring box: a tape, upright for gaps and flat for widths */
.big-lbl { font: 600 0.8rem/1.2 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.big {
  position: relative;
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px 12px 26px;
  border-radius: 8px;
  background: var(--tape);
  box-shadow: inset 0 -4px 0 var(--tape-edge);
}
.big::before {
  content: "";
  position: absolute;
  pointer-events: none;
  opacity: 0.55;
}
.big.v::before {
  left: 0; top: 0; bottom: 0; width: 15px;
  background:
    linear-gradient(180deg, var(--tape-ink) 1.5px, transparent 1.5px) 0 3px / 15px 20px repeat-y,
    linear-gradient(180deg, var(--tape-ink) 1px, transparent 1px) 0 13px / 10px 20px repeat-y,
    linear-gradient(180deg, var(--tape-ink) 1px, transparent 1px) 0 3px / 5px 4px repeat-y;
}
.big.h { padding: 22px 14px 12px; }
.big.h::before {
  left: 0; right: 0; top: 0; height: 13px;
  background:
    linear-gradient(90deg, var(--tape-ink) 1.5px, transparent 1.5px) 3px 0 / 20px 13px repeat-x,
    linear-gradient(90deg, var(--tape-ink) 1px, transparent 1px) 13px 0 / 20px 9px repeat-x,
    linear-gradient(90deg, var(--tape-ink) 1px, transparent 1px) 3px 0 / 4px 5px repeat-x;
}
.big input {
  flex: 1 1 auto; min-width: 0; width: 100%;
  padding: 10px 12px;
  border: 2px solid rgba(27, 26, 16, 0.55);
  border-radius: 6px;
  background: #fff;
  color: var(--tape-ink);
  font: 600 2rem/1 var(--mono);
  font-variant-numeric: tabular-nums;
}
.big input::placeholder { color: rgba(27, 26, 16, 0.4); font: 500 1.1rem var(--body); }
.big input:focus { outline: none; border-color: var(--tape-ink); }
.big .unit { font: 600 1rem var(--mono); color: var(--tape-ink); }
.big.need { box-shadow: inset 0 -4px 0 var(--tape-edge), 0 0 0 3px var(--need), 0 0 16px 3px var(--need-glow); }
.big.need input { border-color: var(--need); }
.big.need.pulse { animation: needpulse 1.4s ease-in-out infinite; }
@keyframes needpulse {
  50% { box-shadow: inset 0 -4px 0 var(--tape-edge), 0 0 0 4px var(--need), 0 0 26px 8px var(--need-glow); }
}
.fld { display: grid; gap: 6px; }
.fld input {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--rule);
  border-radius: 8px;
  background: var(--ground);
  font: 600 1.2rem var(--mono);
}
.fld small { color: var(--ink-2); font-size: 0.88rem; line-height: 1.4; }
.lbl { font: 600 0.8rem/1.2 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.seg { display: flex; border: 1.5px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button {
  appearance: none; flex: 1 1 0;
  padding: 10px 12px;
  border: 0;
  background: transparent;
  font-weight: 600;
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  appearance: none;
  min-height: 50px;
  padding: 10px 18px;
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: transparent;
  font-weight: 700;
  font-size: 1.02rem;
  cursor: pointer;
}
.btn.primary { flex: 1 1 auto; background: var(--ink); color: var(--surface); }
.btn.go { flex: 1 1 100%; border-color: var(--good); background: var(--good); color: #fff; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.armed { border-color: var(--need); background: var(--need); color: #fff; }
.chipbtn {
  appearance: none;
  justify-self: start;
  padding: 8px 14px;
  border: 1.5px solid var(--chalk);
  border-radius: 999px;
  background: var(--chalk-soft);
  color: var(--chalk);
  font-weight: 600;
  cursor: pointer;
}
.linkish {
  appearance: none; justify-self: start;
  padding: 0; border: 0; background: none;
  color: var(--chalk); font-weight: 600; text-decoration: underline; cursor: pointer;
}
.note { color: var(--ink-2); }
.note b { color: var(--ink); font-family: var(--mono); }
.warn { color: var(--warn); font-weight: 600; }
.err { color: var(--need); font-weight: 600; }
.steps3 { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }

/* results */
.bay-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.bay-head span { color: var(--ink-2); font-size: 0.95rem; }
.sheets { list-style: none; margin: 0; padding: 0; display: grid; }
.sheets li {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: baseline;
  gap: 2px 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule);
}
.sheets li:last-child { border-bottom: 0; }
.sid { font: 700 1.15rem var(--display); letter-spacing: 0.03em; }
.num { font: 600 1.9rem/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.chk { grid-column: 1 / -1; color: var(--ink-2); font-size: 0.9rem; text-align: right; }
.marks4 { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px 10px; align-items: baseline; padding: 10px; border-radius: 8px; background: var(--surface); }
.marks4 .num { text-align: left; font-size: 1.6rem; }
.marks4 .num small { font: 500 0.75rem var(--body); color: var(--ink-2); }
.q4 { display: grid; grid-template-columns: auto 1fr 1fr; gap: 2px 14px; align-items: baseline; text-align: right; font: 600 1.2rem/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.q4 small { font: 500 0.75rem var(--body); color: var(--ink-2); }
.q4 small:nth-child(3n+1) { text-align: left; }
.pair { display: flex; justify-content: flex-end; gap: 16px; font: 600 1.35rem/1 var(--mono); font-variant-numeric: tabular-nums; }
.pair small { font: 500 0.75rem var(--body); color: var(--ink-2); }
.rip { grid-column: 1 / -1; color: var(--warn); font-weight: 600; font-size: 0.92rem; }
.howcut { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.whole { display: grid; gap: 10px; padding: 14px; border: 1.5px dashed var(--chalk); border-radius: 10px; background: var(--chalk-soft); }
.whole > .lbl { color: var(--chalk); }
.marks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.marks > div { display: grid; gap: 4px; padding: 10px; border-radius: 8px; background: var(--surface); }
.marks .num { text-align: left; }
.each { border-top: 1px solid var(--rule); padding-top: 10px; }
.each > summary { cursor: pointer; font-weight: 700; color: var(--chalk); }
.each[open] > summary { margin-bottom: 10px; }
.each > * + * { margin-top: 10px; }
.changes { display: flex; flex-wrap: wrap; gap: 8px; }
.changes button {
  appearance: none;
  padding: 7px 12px;
  border: 1.5px solid var(--rule);
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
}
.changes button b { font-family: var(--mono); }
.changes button.missing { border-color: var(--need); color: var(--need); }
.status { color: var(--good); font-weight: 600; min-height: 1.5em; }
.copy-fallback { width: 100%; min-height: 10em; font: 500 0.85rem var(--mono); padding: 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--ground); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .hs-a.hot, .big.need.pulse { animation: none; } }
</style>

<div class="app">
  <header class="bar">
    <button class="brand" type="button" id="home">Two-Tape Fence Cuts</button>
    <span class="crumb" id="crumb"></span>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>

<script id="fence-core">
/* Two-Tape Fence Cuts: calculation core. Pure functions, no DOM, so it can be
   exercised directly by tests/test_core.js. Units: millimetres.
   Frame: x runs along the fence from the bay's start post, y is up. Sheets hang plumb. */
(function (root) {
  'use strict';

  var DEFAULTS = Object.freeze({
    mode: 'gap',        // 'gap': one reading per post (rail-to-rail); 'string': drops to both rails from a level line
    levelRail: 'top',   // gap mode only: 'top' level, 'bottom' level, or 'raked' (top rail on a set rake)
    topRise: 0,         // raked top rail: its rise across one sheet width (mm), measured with a sheet held plumb
    topRiseDir: 'up',   // 'up' = rises toward the higher-numbered posts, 'down' = falls toward them
    cutEnds: 'auto',    // 'auto' | 'bottom' | 'top' | 'both'
    bayWidth: 2365,     // standard bay, post face to post face
    sheetsPerBay: 3,
    lap: 0,             // overlap between neighbouring sheets
    allowance: 0,       // added to every reading to turn it into a sheet length
    stock: 0,           // stock sheet length; 0 = unknown
    floatTol: 5,        // largest corner gap accepted at a square end
    spreadTol: 20,      // an odd bay within this of a whole sheet count is spread, not ripped
    widthMode: 'standard' // 'standard': a blank bay width means the standard bay; 'each': every width must be entered
  });

  function num(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'number') return Number.isFinite(v) ? v : null;
    var t = String(v).replace(/[\s,]/g, '');
    if (t === '') return null;
    var n = Number(t);
    return Number.isFinite(n) ? n : null;
  }

  function resolveSettings(raw) {
    var s = Object.assign({}, DEFAULTS);
    var r = raw || {};
    if (r.mode === 'gap' || r.mode === 'string') s.mode = r.mode;
    if (['top', 'bottom', 'raked'].indexOf(r.levelRail) >= 0) s.levelRail = r.levelRail;
    if (r.topRiseDir === 'up' || r.topRiseDir === 'down') s.topRiseDir = r.topRiseDir;
    if (r.widthMode === 'each' || r.widthMode === 'standard') s.widthMode = r.widthMode;
    s.topRiseUnset = num(r.topRise) === null;       // a raked rail can't be drawn without its rise
    if (['auto', 'bottom', 'top', 'both'].indexOf(r.cutEnds) >= 0) s.cutEnds = r.cutEnds;
    ['bayWidth', 'sheetsPerBay', 'lap', 'allowance', 'stock', 'floatTol', 'spreadTol', 'topRise'].forEach(function (k) {
      var n = num(r[k]);
      if (n !== null) s[k] = n;
    });
    if (!(s.bayWidth > 0)) s.bayWidth = DEFAULTS.bayWidth;
    s.sheetsPerBay = Math.max(1, Math.round(s.sheetsPerBay));
    s.lap = Math.max(0, s.lap);
    s.stock = Math.max(0, s.stock);
    s.floatTol = Math.max(0, s.floatTol);
    s.spreadTol = Math.max(0, s.spreadTol);
    s.topRise = Math.abs(s.topRise);
    s.cover = (s.bayWidth - s.lap) / s.sheetsPerBay;       // sheet pitch in a standard bay
    if (!(s.cover > 0)) { s.lap = 0; s.cover = s.bayWidth / s.sheetsPerBay; }
    s.sheetWidth = s.cover + s.lap;                          // physical sheet width
    return s;
  }

  // Rail heights at one station: T = top rail stop line, B = bottom rail seat line.
  // Any constant datum works; only differences and slopes matter. null if a reading is missing.
  // In gap mode the top rail's height at the station (tTop) comes from the rake, not a reading.
  function railsAt(r, s, tTop) {
    if (!r) return null;
    if (s.mode === 'string') {
      var t = num(r.t), b = num(r.b);
      if (t === null || b === null) return null;
      return { T: -t, B: -b - s.allowance };
    }
    var g = num(r.g);
    if (g === null) return null;
    var gap = g + s.allowance;
    if (s.levelRail === 'bottom') return { T: gap, B: 0 };
    var t0 = tTop || 0;
    return { T: t0, B: t0 - gap };
  }

  // Sheet spans [a, b] across a bay of width W. Sheets are laid from the start post;
  // an odd bay either spreads its sheets (within spreadTol) or rips the last one.
  function layoutSheets(W, s) {
    var c = s.cover, lap = s.lap, w = s.sheetWidth;
    var k = (W - lap) / c;
    var nr = Math.round(k);
    var spans = [], i;
    if (nr >= 1 && Math.abs(k - nr) * c <= s.spreadTol) {
      if (nr === 1) return { spans: [{ a: 0, b: W, rip: 0 }], pitch: W, even: true };
      var p = (W - w) / (nr - 1);
      for (i = 0; i < nr; i++) spans.push({ a: i * p, b: i * p + w, rip: 0 });
      return { spans: spans, pitch: p, even: true };
    }
    var n = Math.max(1, Math.ceil(k));
    for (i = 0; i < n; i++) {
      var a = i * c;
      var last = i === n - 1;
      var b = last ? W : a + w;
      spans.push({ a: a, b: b, rip: last ? w - (b - a) : 0 });
    }
    return { spans: spans, pitch: c, even: false };
  }

  function planBay(W, r0, r1, s) {
    var out = { width: W, errors: [], warnings: [], sheets: [], stacks: [], chalk: null, mode: null, delta: 0 };
    if (!(W > 0)) { out.errors.push('Bay width has to be more than 0 mm.'); return out; }
    var sT = (r1.T - r0.T) / W, sB = (r1.B - r0.B) / W;
    var T = function (x) { return r0.T + sT * x; };
    var B = function (x) { return r0.B + sB * x; };
    var g0 = r0.T - r0.B, g1 = r1.T - r1.B;
    out.sT = sT; out.sB = sB; out.g0 = g0; out.g1 = g1;
    out.rails = { T0: r0.T, T1: r1.T, B0: r0.B, B1: r1.B };
    // Whole bay laid out as fitted, factory tops on one square line: both cut lines run
    // straight across it. Marks at x = 0 and x = W, measured down from the factory tops,
    // with the top rail's high end right at the tops.
    var hiBay = Math.max(r0.T, r1.T);
    out.layout = { width: W, top: [hiBay - r0.T, hiBay - r1.T], bottom: [hiBay - r0.B, hiBay - r1.B] };
    if (!(g0 > 0) || !(g1 > 0)) { out.errors.push('The gap between the rails has to be more than 0 mm at both posts.'); return out; }
    if (Math.abs(g1 - g0) / W > 0.15) {
      out.warnings.push('The gap changes by ' + Math.round(Math.abs(g1 - g0)) + ' mm across one bay. Check both readings.');
    }

    var lay = layoutSheets(W, s);
    var w = s.sheetWidth;
    var gapTop = Math.abs(sT) * w, gapBot = Math.abs(sB) * w;   // corner gap a square end would leave
    var cutTop, cutBot;
    if (s.cutEnds === 'top') { cutTop = true; cutBot = false; }
    else if (s.cutEnds === 'bottom') { cutTop = false; cutBot = true; }
    else if (s.cutEnds === 'both') { cutTop = true; cutBot = true; }
    else { cutTop = gapTop > s.floatTol; cutBot = gapBot > s.floatTol; }
    var mode = cutTop && cutBot ? 'both' : cutTop ? 'top' : cutBot ? 'bottom' : 'square';
    out.mode = mode;
    out.even = lay.even;
    out.pitch = lay.pitch;
    out.delta = (g1 - g0) * lay.pitch / W;
    if (!cutTop && gapTop > s.floatTol + 1e-9) {
      out.warnings.push('Square tops leave up to ' + gapTop.toFixed(1) + ' mm of gap under the top rail at one corner.');
    }
    if (!cutBot && gapBot > s.floatTol + 1e-9) {
      out.warnings.push('Square bottoms leave up to ' + gapBot.toFixed(1) + ' mm of gap above the bottom rail at one corner.');
    }

    out.sheets = lay.spans.map(function (sp, i) {
      var a = sp.a, b = sp.b;
      var Ta = T(a), Tb = T(b), Ba = B(a), Bb = B(b);
      // A square top stops at the lowest point of the top rail over the sheet;
      // a square bottom sits on the highest point of the bottom rail.
      var top = cutTop ? [Ta, Tb] : [Math.min(Ta, Tb), Math.min(Ta, Tb)];
      var bot = cutBot ? [Ba, Bb] : [Math.max(Ba, Bb), Math.max(Ba, Bb)];
      var lenL = top[0] - bot[0], lenR = top[1] - bot[1];
      var ref, lines;
      if (mode === 'bottom') {
        ref = 'top';
        lines = [{ end: 'bottom', l: lenL, r: lenR }];
      } else if (mode === 'both') {
        // Factory end goes up. First rake the top to the rail (the high corner is untouched),
        // then measure the lengths down from the raked top: they are the rail-to-rail gaps.
        var hi = Math.max(Ta, Tb);
        ref = 'top';
        lines = [{ end: 'top', from: 'factory', l: hi - Ta, r: hi - Tb },
                 { end: 'bottom', from: 'raked', l: lenL, r: lenR }];
      } else {
        ref = 'bottom';
        lines = [{ end: 'top', l: lenL, r: lenR }];
      }
      // Stock needed, measured from the factory end.
      var need = mode === 'both' ? Math.max(lines[0].l + lenL, lines[0].r + lenR)
                                 : Math.max(lines[0].l, lines[0].r);
      return {

<script>

  // Both ends of every sheet are cut: the top to the top rail, the bottom to the bottom

  // splits between the rails (the top rail's rise across the bay).

  function incoming(k) { return pos(state.job.posts[k].g); }

  /* ---------- screen order ---------- */

  /* ---------- picture: what to measure now, in red ---------- */

      '<polygon points="' + x + ',' + y2 + ' ' + (x - 4.5) + ',' + (y2 - 9) + ' ' + (x + 4.5) + ',' + (y2 - 9) + '"/>' +

      '<polygon points="' + x2 + ',' + y + ' ' + (x2 - 9) + ',' + (y - 4.5) + ' ' + (x2 - 9) + ',' + (y + 4.5) + '"/>' +

  /* ---------- pieces ---------- */

    }

        '<button class="btn primary" type="button" data-act="more" data-needs>Another bay →</button>' +
        '<button class="btn go" type="button" data-act="finish" data-needs>That’s the last post: show my cuts</button></div>';
    }
    return html + '</section>';
  }

  function bayHTML(k) {
    var b = state.job.bays[k], s = settings();
    return '<section class="card">' +
      '<p class="eyebrow">Bay ' + (k + 1) + ' · across</p><h1>Bay ' + (k + 1) + ' width</h1>' +
      '<p class="instr">Measure <b>across</b> from P' + (k + 1) + ' to P' + (k + 2) + ': post face to post face, tape held <b>level</b>.</p>' +
      '<div class="pic">' + picture('bay', k) + '</div>' +
      bigInput('f-w', b.width, 'h', null) +
      '<button class="chipbtn" type="button" data-act="fullbay">Full bay: ' + mm(s.bayWidth) + '</button>' +
      '<p class="note" id="live-fit"></p>' +
      navButtons('Next: bay ' + (k + 1) + ' diagonal \u2192') + '</section>';
  }

  function diagHTML(k) {
    var b = state.job.bays[k];
    return '<section class="card">' +
      '<p class="eyebrow">Bay ' + (k + 1) + ' · corner to corner</p><h1>Bay ' + (k + 1) + ' diagonal</h1>' +
      '<p class="instr">Pull the tape straight across the open bay, like checking for square. Go from the <b>underside of the top rail at P' + (k + 1) +
      '</b> to the <b>top of the bottom rail at P' + (k + 2) + '</b>, both right beside the posts.</p>' +
      '<div class="pic">' + picture('diag', k) + '</div>' +
      bigInput('f-d', b.diag || '', 'h', null) +
      '<p class="note" id="live-diag"></p>' +
      '<p class="note">This tells the app how much of the slope is in the top rail, so the top of each sheet can be cut to match it.</p>' +
      navButtons('Next: P' + (k + 2) + ' gap \u2192') + '</section>';
  }
  function bayReady(k) {
    return ['post:' + k, 'bay:' + k, 'diag:' + k, 'post:' + (k + 1)].every(screenDone) && bayRise(k) !== null;
  }
  function resultsHTML() {
    var pl = C.planRun(coreJob()), su = state.job.setup;
    var sheets = 0;
    pl.bays.forEach(function (b, k) { if (bayReady(k) && !b.errors.length) sheets += b.sheets.length; });
    var html = '<section class="card">' +
      '<p class="eyebrow">Cut list</p><h1>' + sheets + ' ' + plural(sheets, 'sheet', 'sheets') + ', ' + pl.bays.length + ' ' + plural(pl.bays.length, 'bay', 'bays') + '</h1>' +
      '<p class="instr">Every sheet is cut <b>top and bottom</b>. Mark a whole bay at once: four marks and two string lines per bay.</p>' +
      '<p class="note">Lay sheets face up with their tops away from you, so the edge that faces the lower-numbered post is on your left. Every mark is measured down from the factory top.</p>' +
      '<div class="actions"><button class="btn primary" type="button" data-act="copy">Copy cut list</button></div>' +
      '<p class="status" id="status" aria-live="polite"></p>' +
      '<textarea class="copy-fallback" id="copy-fallback" readonly hidden aria-label="Cut list text"></textarea></section>';

    pl.bays.forEach(function (bay, k) {
      var ready = bayReady(k) && !bay.errors.length;
      html += '<section class="card"><div class="bay-head"><h2>Bay ' + (k + 1) + '</h2><span>P' + (k + 1) + ' → P' + (k + 2) +
        (ready ? ' · ' + mm(bay.width) + ' wide · ' + bay.sheets.length + ' ' + plural(bay.sheets.length, 'sheet', 'sheets') : '') + '</span></div>';
      if (!ready) {
        var open = seq().filter(function (sc) {
          return !screenDone(sc) && [ 'post:' + k, 'bay:' + k, 'diag:' + k, 'post:' + (k + 1) ].indexOf(sc) >= 0;
        })[0] || 'diag:' + k;
        html += '<p class="err">Not measured yet.</p>' +
          '<button class="btn primary" type="button" data-act="goto" data-arg="' + open + '">Measure it →</button></section>';
        return;
      }
      var n = bay.sheets.length, first = (k + 1) + '.1', last = (k + 1) + '.' + n;
      var rip = bay.sheets[n - 1].rip > 0.5 ? bay.sheets[n - 1] : null;
      var L = bay.layout, rise = bayRise(k);
      var rightLbl = rip ? mm(bay.width) + ' across' : 'Right edge of ' + last;
      function cell(v) { return '<span class="num">' + mm(v) + (Math.round(v) === 0 ? '<small> at the top</small>' : '') + '</span>'; }

      // Whole bay at once: laid out as fitted with the factory tops square across, the top
      // cut and the bottom cut are each one straight line through the whole bay.
      html += '<div class="whole"><p class="lbl">Whole bay at once</p>' +
        '<div class="marks4"><span></span><span class="lbl">Left edge of ' + first + '</span><span class="lbl">' + rightLbl + '</span>' +
        '<span class="lbl">Top cut</span>' + cell(L.top[0]) + cell(L.top[1]) +
        '<span class="lbl">Bottom cut</span>' + cell(L.bottom[0]) + cell(L.bottom[1]) + '</div>' +
        '<ol class="howcut">' +
        '<li>Lay ' + (n > 1 ? 'sheets ' + first + ' to ' + last + ' side by side, lapped exactly as they go in' : 'sheet ' + first) +
          ', factory tops pushed against a straight string pulled square across the sheets.</li>' +
        '<li><b>Top cut:</b> from the tops, mark <b>' + mm(L.top[0]) + '</b> on the left edge of ' + first + ' and <b>' + mm(L.top[1]) + '</b> ' +
          (rip ? 'at ' + mm(bay.width) + ' across' : 'on the right edge of ' + last) + '. String between them, tick every pan.</li>' +
        '<li><b>Bottom cut:</b> from the tops, mark <b>' + mm(L.bottom[0]) + '</b> and <b>' + mm(L.bottom[1]) + '</b> the same way. String, tick every pan.</li>' +
        '<li>Cut every sheet on both lines.</li>' +
        (rip ? '<li>Rip ' + last + ' to <b>' + mm(rip.width) + '</b> wide, keeping its left edge.</li>' : '') + '</ol>' +
        '<p class="note">The top rail ' + (Math.abs(rise) < 0.5 ? 'is level' : (rise < 0 ? 'falls ' : 'rises ') + '<b>' + mm(Math.abs(rise)) + '</b> mm') +
        ' across this bay. Laid out this way, each sheet needs to be at least <b>' + mm(Math.max(L.bottom[0], L.bottom[1])) + '</b> mm long.</p></div>';

      // One sheet at a time: four marks, each from that sheet's own factory top.
      html += '<details class="each"><summary>Or one sheet at a time</summary>' +
        '<p class="note">For each sheet, measure down from its factory top: mark the top cut at the left and right edges and join them, then the bottom cut the same way. Cut both.</p>' +
        '<ol class="sheets">';
      bay.sheets.forEach(function (sh) {
        var t = sh.lines[0], bl = t.l + sh.lines[1].l, br = t.r + sh.lines[1].r;
        html += '<li><span class="sid">Sheet ' + (k + 1) + '.' + sh.n + '</span>' +
          '<span class="q4"><span></span><small>left</small><small>right</small>' +
          '<small>top</small><span>' + mm(t.l) + '</span><span>' + mm(t.r) + '</span>' +
          '<small>bottom</small><span>' + mm(bl) + '</span><span>' + mm(br) + '</span></span>' +
          (sh.rip > 0.5 ? '<span class="rip">Part sheet: cut it like the others, then rip it to ' + mm(sh.width) + ' wide, keeping the left edge.</span>' : '') + '</li>';
      });
      html += '</ol></details>';
      bay.warnings.forEach(function (w) { html += '<p class="warn">' + esc(w) + '</p>'; });
      html += '</section>';
    });

    html += '<section class="card"><p class="instr"><b>Change a measurement</b></p><div class="changes">';
    seq().forEach(function (sc) {
      var m, label, val;
      if (sc === 'setup') { label = 'Setup'; val = su.sheetsPerBay + ' sheets, ' + su.bayWidth; }
      else if ((m = /^post:(\d+)$/.exec(sc))) {
        var k = +m[1], p = state.job.posts[k];
        label = 'P' + (k + 1) + ' gap'; val = p.step && k > 0 && k < lastPost() ? (p.g || '?') + ' / ' + (p.g2 || '?') : (p.g || '?');
      } else if ((m = /^bay:(\d+)$/.exec(sc))) { label = 'Bay ' + (+m[1] + 1) + ' width'; val = state.job.bays[+m[1]].width || '?'; }
      else if ((m = /^diag:(\d+)$/.exec(sc))) { label = 'Bay ' + (+m[1] + 1) + ' diagonal'; val = state.job.bays[+m[1]].diag || '?'; }
      html += '<button type="button" data-act="goto" data-arg="' + sc + '"' + (screenDone(sc) ? '' : ' class="missing"') + '>' +
        esc(label) + ' <b>' + esc(val) + '</b></button>';
    });
    html += '</div><div class="actions">' +
      '<button class="btn" type="button" data-act="addbay">Add another bay</button>' +
      (state.job.bays.length > 1 ? '<button class="btn" type="button" data-act="dropbay">Remove the last bay</button>' : '') +
      '<button class="btn" type="button" data-act="newjob" id="newjob">New job</button></div></section>';
    return html;
  }

  /* ---------- render ---------- */
  function render(focus) {
    var sc = state.screen, m, html;
    if (sc === 'start') html = startHTML();
    else if (sc === 'setup') html = setupHTML();
    else if ((m = /^post:(\d+)$/.exec(sc))) html = postHTML(+m[1]);
    else if ((m = /^bay:(\d+)$/.exec(sc))) html = bayHTML(+m[1]);
    else if ((m = /^diag:(\d+)$/.exec(sc))) html = diagHTML(+m[1]);
    else html = resultsHTML();
    $('#screen').innerHTML = html;
    $('#crumb').textContent = crumb(sc);
    live();
    save();
    window.scrollTo(0, 0);
    if (focus !== false) {
      var first = Array.prototype.filter.call(document.querySelectorAll('#screen .big input'), function (el) { return !pos(el.value); })[0] ||
                  document.querySelector('#screen .big input');
      if (first) { try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); } }
    }
  }
  function go(sc) { state.screen = sc; render(); }

  // Live state on the current screen: red glow on empty boxes, buttons, and checks.
  function live() {
    var sc = state.screen, m;
    var boxes = document.querySelectorAll('#screen .big');
    var firstEmpty = true;
    Array.prototype.forEach.call(boxes, function (box) {
      var empty = !pos(box.querySelector('input').value);
      box.classList.toggle('need', empty);
      box.classList.toggle('pulse', empty && firstEmpty);
      if (empty) firstEmpty = false;
    });
    var ok = screenDone(sc);
    Array.prototype.forEach.call(document.querySelectorAll('#screen [data-primary], #screen [data-needs]'), function (b) {
      if (sc !== 'start') b.disabled = !ok;
    });
    if ((m = /^post:(\d+)$/.exec(sc)) && +m[1] > 0) {
      var k = +m[1], warn = $('#live-warn'), prev = outgoing(k - 1), now = incoming(k), W = pos(state.job.bays[k - 1].width);
      var msg = '';
      if (now !== null && (now < 300 || now > 3500)) msg = 'That’s an unusual gap for a fence. Check the reading.';
      else if (now !== null && prev !== null && W !== null && Math.abs(now - prev) > 0.15 * W) {
        msg = 'That’s ' + mm(Math.abs(now - prev)) + ' mm different from P' + k + '. Worth a second look.';
      }
      warn.textContent = msg; warn.hidden = !msg;
    }
    if ((m = /^diag:(\d+)$/.exec(sc))) {
      var kd = +m[1], bd = state.job.bays[kd], dd = pos(bd.diag), wd = pos(bd.width), out = $('#live-diag'), txt = '';
      if (dd !== null && wd !== null && dd <= wd) txt = '<span class="warn">The diagonal is always longer than the width (' + mm(wd) + '). Measure it again.</span>';
      else if (dd !== null && wd !== null) {
        var rr = bayRise(kd);
        if (rr === null) txt = 'Enter the P' + (kd + 2) + ' gap next and the top rail\u2019s slope follows.';
        else if (Math.abs(rr) > 0.35 * wd) txt = '<span class="warn">That makes the top rail very steep. Check the diagonal and the width.</span>';
        else txt = 'The top rail ' + (Math.abs(rr) < 0.5 ? 'is level' : (rr < 0 ? 'falls ' : 'rises ') + '<b>' + mm(Math.abs(rr)) + '</b> mm') + ' across this bay.';
      }
      out.innerHTML = txt;
    }
    if ((m = /^bay:(\d+)$/.exec(sc))) {
      var W2 = pos(state.job.bays[+m[1]].width), fit = $('#live-fit');
      if (W2 === null) { fit.textContent = ''; }
      else {
        var lay = C.layoutSheets(W2, settings()), n = lay.spans.length, lastSp = lay.spans[n - 1];
        fit.innerHTML = 'Takes <b>' + n + '</b> ' + plural(n, 'sheet', 'sheets') +
          (lastSp.rip > 0.5 ? ', the last one ripped to <b>' + mm(lastSp.b - lastSp.a) + '</b> wide.' : '.') +
          (W2 > settings().bayWidth + 300 ? ' That’s longer than a full bay. Check it.' : '');
      }
    }
  }

  /* ---------- actions ---------- */
  var armed = null;
  function act(name, arg, btn) {
    var sc = state.screen, m;
    if (name === 'begin') { state.job = freshJob(state.job.setup); go('setup'); }
    else if (name === 'continue') { go(firstOpen() || 'results'); }
    else if (name === 'next') { if (screenDone(sc)) go(nextOf(sc)); }
    else if (name === 'back') { go(prevOf(sc)); }
    else if (name === 'goto') { go(arg); }
    else if (name === 'more') {
      if (!screenDone(sc)) return;
      state.job.posts.push(blankPost());
      state.job.bays.push({ width: '' });
      go('bay:' + (state.job.bays.length - 1));
    }
    else if (name === 'finish') { if (screenDone(sc)) go('results'); }
    else if (name === 'addbay') {
      state.job.posts.push(blankPost());
      state.job.bays.push({ width: '' });
      go('bay:' + (state.job.bays.length - 1));
    }
    else if (name === 'dropbay') {
      if (state.job.bays.length < 2) return;
      state.job.posts.pop(); state.job.bays.pop();
      state.job.posts[lastPost()].step = false;
      render(false);
    }
    else if (name === 'step' && (m = /^post:(\d+)$/.exec(sc))) {
      var p = state.job.posts[+m[1]];
      p.step = !p.step;
      render();
    }
    else if (name === 'fullbay' && (m = /^bay:(\d+)$/.exec(sc))) {
      state.job.bays[+m[1]].width = String(mm(settings().bayWidth));
      render(false);
      var nb = document.querySelector('#screen [data-primary]');
      if (nb) nb.focus();
    }
    else if (name === 'copy') { copyList(); }
    else if (name === 'newjob') {
      if (armed) {
        clearTimeout(armed); armed = null;
        state.job = freshJob(state.job.setup);
        go('setup');
        return;
      }
      var label = btn.textContent;
      btn.textContent = 'Tap again to clear this job';
      btn.classList.add('armed');
      armed = setTimeout(function () { armed = null; if (btn.isConnected) { btn.textContent = label; btn.classList.remove('armed'); } }, 4000);
    }
  }
  $('#screen').addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-act]');
    if (b && !b.disabled) act(b.getAttribute('data-act'), b.getAttribute('data-arg'), b);
  });
  $('#home').addEventListener('click', function () { go('start'); });
  $('#screen').addEventListener('input', function (e) {
    var id = e.target.id || '', sc = state.screen, m;
    if (id.indexOf('s-') === 0) state.job.setup[id.slice(2)] = e.target.value;
    else if ((m = /^post:(\d+)$/.exec(sc)) && (id === 'f-g' || id === 'f-g2')) state.job.posts[+m[1]][id.slice(2)] = e.target.value;
    else if ((m = /^bay:(\d+)$/.exec(sc)) && id === 'f-w') state.job.bays[+m[1]].width = e.target.value;
    else if ((m = /^diag:(\d+)$/.exec(sc)) && id === 'f-d') state.job.bays[+m[1]].diag = e.target.value;
    else return;
    live();
    save();
  });
  $('#screen').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
    e.preventDefault();
    var inputs = Array.prototype.slice.call(document.querySelectorAll('#screen input'));
    var i = inputs.indexOf(e.target);
    if (i >= 0 && i < inputs.length - 1) { inputs[i + 1].focus(); return; }
    var primary = document.querySelector('#screen [data-primary]');
    if (primary && !primary.disabled) primary.click(); else e.target.blur();
  });

  /* ---------- copy ---------- */
  function listText() {
    var pl = C.planRun(coreJob());
    var out = ['TWO-TAPE FENCE CUTS', 'Marks measured down from the top. Sheets face up, tops away, lower-numbered post side on the left.', ''];
    pl.bays.forEach(function (bay, k) {
      if (bay.errors.length || !bayReady(k)) { out.push('Bay ' + (k + 1) + ': not measured yet', ''); return; }
      out.push('Bay ' + (k + 1) + ' (P' + (k + 1) + '-P' + (k + 2) + ', ' + mm(bay.width) + ' wide, ' + bay.sheets.length + ' sheets)');
      var L = bay.layout;
      out.push('  Whole bay, from the factory tops (left edge / ' + mm(bay.width) + ' across):');
      out.push('    top cut     ' + mm(L.top[0]) + ' / ' + mm(L.top[1]));
      out.push('    bottom cut  ' + mm(L.bottom[0]) + ' / ' + mm(L.bottom[1]));
      out.push('  One at a time, from each sheet\'s own top (left / right):');
      bay.sheets.forEach(function (sh) {
        out.push('    Sheet ' + (k + 1) + '.' + sh.n + '   top ' + mm(sh.lines[0].l) + ' / ' + mm(sh.lines[0].r) +
          '   bottom ' + mm(sh.lines[0].l + sh.lines[1].l) + ' / ' + mm(sh.lines[0].r + sh.lines[1].r) +
          (sh.rip > 0.5 ? '   rip to ' + mm(sh.width) + ' wide' : ''));
      });
      out.push('');
    });
    return out.join('\n').replace(new RegExp(MINUS, 'g'), '-');
  }
  function copyList() {
    var text = listText(), fb = $('#copy-fallback'), st = $('#status');
    function fallback() { fb.hidden = false; fb.value = text; fb.focus(); fb.select(); st.textContent = 'Copying is blocked here. The list is selected below.'; }
    try { navigator.clipboard.writeText(text).then(function () { fb.hidden = true; st.textContent = 'Cut list copied.'; }, fallback); }
    catch (e) { fallback(); }
  }

  render(false);
})();
</script>
